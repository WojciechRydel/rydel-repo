# ydotoold needs /dev/uinput, whose access comes from the logind uaccess ACL
# that is only applied once the session is active. The packaged unit starts on
# default.target and has Restart=always with no RestartSec, so it burns its
# five-restart budget in under a second while the ACL is still missing, then
# dies with start-limit-hit -- and type-text silently falls back to wtype,
# which types lowercase into SDL/FreeRDP. Retry until the ACL shows up.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=3
